name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all Bash scripts
        run: |
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then echo "No .sh files yet"; exit 0; fi
          shellcheck $files

  # Added in later phases:
  # ansible-lint  (Phase 2)
  # ruff + pytest (Phase 3)
  # go vet + go test (Phase 4)
