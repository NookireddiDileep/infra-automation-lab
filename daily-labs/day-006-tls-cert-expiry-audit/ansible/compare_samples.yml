---
# Self-test: the Ansible report must be byte-identical to the golden files that Bash, Python and Go also match.
- name: Compare against samples/expected
  hosts: localhost
  gather_facts: false
  vars:
    cs_now: "2026-11-20T00:00:00Z"
    warn_days: 30
    crit_days: 14
    tab: "\t"
    nl: "\n"
    iso_re: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$'
    cases:
      node-01: CRIT
      node-02: OK
      node-03: WARN
  tasks:
    - name: Check and compare each sample
      ansible.builtin.include_tasks: tasks/check_sample.yml
      loop: "{{ cases | dict2items }}"
      loop_control:
        loop_var: case
        label: "{{ case.key }}"

    - name: Every bad inventory must be refused
      ansible.builtin.include_tasks: tasks/refuse_bad.yml
      loop: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/../samples/bad/*.certs', wantlist=True) }}"
      loop_control:
        loop_var: bad_file
        label: "{{ bad_file | basename }}"
