---
# Self-test: the Ansible report must be byte-identical to the golden files that Bash, Python and Go also match.
- name: Compare against samples/expected
  hosts: localhost
  gather_facts: false
  vars:
    cases:
      ocp-prod: CRIT
      ocp-stage: WARN
      ocp-dev: OK
  tasks:
    - name: Check and compare each sample
      ansible.builtin.include_tasks: tasks/check_sample.yml
      vars:
        nodes_file: "{{ playbook_dir }}/../samples/{{ case.key }}.nodes.json"
        events_file: "{{ playbook_dir }}/../samples/{{ case.key }}.events.json"
        nl: "\n"
        # the file lookup strips the trailing newline; put it back so the comparison is byte-exact
        golden: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../samples/expected/' ~ case.key ~ '.report') ~ nl }}"
        want_result: "{{ case.value }}"
      loop: "{{ cases | dict2items }}"
      loop_control:
        loop_var: case
        label: "{{ case.key }}"

    - name: Bad input must be refused with a clear message, never a half report
      ansible.builtin.include_tasks: tasks/refuse.yml
      vars:
        nodes_file: "{{ playbook_dir }}/../samples/{{ case.nodes }}"
        events_file: "{{ playbook_dir }}/../samples/{{ case.events }}"
        want_msg: "{{ case.msg }}"
      loop:
        - {nodes: ocp-dev.nodes.json, events: bad/events-bad-count.json, msg: "bad count in Evicted event on node-01.example.com"}
        - {nodes: bad/nodes-bad-status.json, events: ocp-dev.events.json, msg: "bad condition status in node-01.example.com: MemoryPressure"}
        - {nodes: bad/not-a-list.json, events: ocp-dev.events.json, msg: "nodes: not a List"}
        - {nodes: ocp-dev.nodes.json, events: bad/not-a-list.json, msg: "events: not a List"}
      loop_control:
        loop_var: case
        label: "{{ case.msg }}"
