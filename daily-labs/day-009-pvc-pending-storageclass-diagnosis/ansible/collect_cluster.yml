---
# NOT part of `make test`: needs a cluster and the kubernetes.core collection (ansible-galaxy collection install kubernetes.core).
# Saves live PVCs and StorageClasses in the shape pvcbind.yml / pvcbind.sh expect.
#   ansible-playbook collect_cluster.yml -e out_dir=/tmp -e name=mycluster
- name: Snapshot PVCs and StorageClasses from the current kubeconfig context
  hosts: localhost
  gather_facts: false
  vars:
    out_dir: /tmp
    name: mycluster
  tasks:
    - name: Read every PersistentVolumeClaim (read-only)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
      register: pvcs

    - name: Read every StorageClass (read-only)
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
      register: scs

    - name: Save both as kind List documents
      ansible.builtin.copy:
        content: "{{ {'apiVersion': 'v1', 'kind': 'List', 'items': item.items} | to_nice_json }}"
        dest: "{{ out_dir }}/{{ name }}.{{ item.suffix }}.json"
        mode: "0644"
      loop:
        - {suffix: pvcs, items: "{{ pvcs.resources }}"}
        - {suffix: storageclasses, items: "{{ scs.resources }}"}
      loop_control:
        label: "{{ item.suffix }}"
