---
# Self-test: the Ansible report must be byte-identical to the golden files that Bash, Python and Go also match.
- name: Compare against samples/expected
  hosts: localhost
  gather_facts: false
  vars:
    cases:
      ocp-prod: CRIT
      ocp-lab: CRIT
      ocp-stage: WARN
      ocp-dev: OK
  tasks:
    - name: Check and compare each sample
      ansible.builtin.include_tasks: tasks/check_sample.yml
      vars:
        pvcs_file: "{{ playbook_dir }}/../samples/{{ case.key }}.pvcs.json"
        scs_file: "{{ playbook_dir }}/../samples/{{ case.key }}.storageclasses.json"
        nl: "\n"
        # the file lookup strips the trailing newline; put it back so the comparison is byte-exact
        golden: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../samples/expected/' ~ case.key ~ '.report') ~ nl }}"
        want_result: "{{ case.value }}"
      loop: "{{ cases | dict2items }}"
      loop_control:
        loop_var: case
        label: "{{ case.key }}"

    - name: Bad input must be refused with a clear message, never a half report
      ansible.builtin.include_tasks: tasks/refuse.yml
      vars:
        pvcs_file: "{{ playbook_dir }}/../samples/{{ case.pvcs }}"
        scs_file: "{{ playbook_dir }}/../samples/{{ case.scs }}"
        want_msg: "{{ case.msg }}"
      loop:
        - {pvcs: bad/pvcs-bad-phase.json, scs: ocp-dev.storageclasses.json, msg: "pvcs: bad phase in dev/app-0"}
        - {pvcs: ocp-dev.pvcs.json, scs: bad/sc-bad-mode.json, msg: "storageclasses: bad volumeBindingMode in gold"}
        - {pvcs: bad/not-a-list.json, scs: ocp-dev.storageclasses.json, msg: "pvcs: not a List"}
        - {pvcs: ocp-dev.pvcs.json, scs: bad/not-a-list.json, msg: "storageclasses: not a List"}
      loop_control:
        loop_var: case
        label: "{{ case.msg }}"
