---
# In:  cos_file, mcps_file (paths)
# Out: check_report (text, byte-identical to the Bash/Python/Go report), check_result (OK|WARN|CRIT)
- name: Load the saved ClusterOperator list and the saved MachineConfigPool list
  ansible.builtin.set_fact:
    cos_doc: "{{ lookup('ansible.builtin.file', cos_file) | from_json }}"
    mcps_doc: "{{ lookup('ansible.builtin.file', mcps_file) | from_json }}"

- name: Refuse anything that is not a List (clusteroperators)
  ansible.builtin.assert:
    that:
      - cos_doc is mapping
      - cos_doc['kind'] | default('') == 'List'
      - cos_doc['items'] is defined and cos_doc['items'] is sequence and cos_doc['items'] is not string
    fail_msg: "clusteroperators: not a List (expected kind List with items[]): {{ cos_file }}"
    quiet: true

- name: Refuse anything that is not a List (mcps)
  ansible.builtin.assert:
    that:
      - mcps_doc is mapping
      - mcps_doc['kind'] | default('') == 'List'
      - mcps_doc['items'] is defined and mcps_doc['items'] is sequence and mcps_doc['items'] is not string
    fail_msg: "mcps: not a List (expected kind List with items[]): {{ mcps_file }}"
    quiet: true

- name: Judge every operator and pool
  ansible.builtin.set_fact:
    check_data: "{{ lookup('ansible.builtin.template', 'findings.j2') | from_json }}"

- name: Refuse bad input instead of printing a half report
  ansible.builtin.assert:
    that: check_data['errors'] | length == 0
    fail_msg: "{{ check_data['errors'] | first | default('') }}"
    quiet: true

- name: Render the report
  ansible.builtin.set_fact:
    check_result: "{{ result }}"
    check_report: "{{ (lookup('ansible.builtin.template', 'report.j2') | trim) ~ nl }}"
  vars:
    nl: "\n"
    levels: ["CRIT", "WARN"]
    rows: "{{ check_data['rows'] | sort(attribute='rank,subject', case_sensitive=true) }}"
    operators: "{{ check_data['operators'] }}"
    pools: "{{ check_data['pools'] }}"
    report_name: "{{ cos_file | basename | regex_replace('(\\.clusteroperators)?\\.json$', '') }}"
    classes: "{{ ['UNAVAILABLE', 'NOSTATUS', 'DEGRADED', 'BLOCKED', 'STALLED', 'PROGRESSING', 'UPDATING', 'PAUSED'] | select('in', rows | map(attribute='cls') | list) | list }}"
    crit: "{{ rows | selectattr('rank', 'equalto', 0) | list | length }}"
    warn: "{{ rows | selectattr('rank', 'equalto', 1) | list | length }}"
    result: "{{ 'CRIT' if crit | int > 0 else ('WARN' if warn | int > 0 else 'OK') }}"
    verdict: "{{ 'NO-GO' if result == 'CRIT' else ('CAUTION' if result == 'WARN' else 'GO') }}"
    hints:
      UNAVAILABLE: "operator Available is not True, or pool nodes are down outside a rollout: oc describe co/mcp, oc get nodes; do not upgrade until it is resolved"
      NOSTATUS: "the operator reports no Available condition, so it is not reporting at all: check its pod and events in its own namespace"
      DEGRADED: "Degraded=True: oc describe co/<name> for an operator, oc describe mcp plus machine-config-daemon logs for a pool; fix it before the upgrade"
      BLOCKED: "Upgradeable=False blocks minor-version updates (patch updates still run): read the condition message, fix it or give the admin acknowledgement it asks for"
      STALLED: "updated is below machineCount, the pool is not updating and not paused: it is stuck, check nodes for a stale desiredConfig and the machine-config-controller logs"
      PROGRESSING: "an operator is mid-rollout: wait for Progressing=False, or the upgrade stacks a second rollout on top"
      UPDATING: "the pool is rolling out a rendered config: let it finish, a cluster upgrade now would queue a second change on the same nodes"
      PAUSED: "spec.paused=true: the pool ignores new rendered configs and stays on the old version; unpause before the upgrade unless it is a deliberate canary"
