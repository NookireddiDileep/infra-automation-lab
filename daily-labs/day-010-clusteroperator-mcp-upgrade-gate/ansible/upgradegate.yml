---
# Judge saved ClusterOperators and MachineConfigPools and write the gate report. Idempotent: same input, same file, changed=0 on re-run.
#   ansible-playbook upgradegate.yml -e cos_file=../samples/ocp-prod.clusteroperators.json -e mcps_file=../samples/ocp-prod.mcps.json
#   ansible-playbook upgradegate.yml ... -e fail_on_crit=true     # gate a pipeline: NO-GO fails the play
- name: OpenShift pre-upgrade gate (offline, against saved oc JSON)
  hosts: localhost
  gather_facts: false
  vars:
    cos_file: "{{ playbook_dir }}/../samples/ocp-prod.clusteroperators.json"
    mcps_file: "{{ playbook_dir }}/../samples/ocp-prod.mcps.json"
    fail_on_crit: false
    out_dir: "{{ playbook_dir }}/reports"
  tasks:
    - name: Run the check
      ansible.builtin.include_tasks: tasks/check.yml

    - name: Make sure the output directory exists
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: directory
        mode: "0755"

    - name: Write the report
      ansible.builtin.copy:
        content: "{{ check_report }}"
        dest: "{{ out_dir }}/{{ cos_file | basename | regex_replace('(\\.clusteroperators)?\\.json$', '') }}.report"
        mode: "0644"

    - name: Show the verdict
      ansible.builtin.debug:
        msg: "{{ check_report.split('\n')[-2] }}"

    - name: Gate on CRIT when asked (the playbook equivalent of exit code 2)
      ansible.builtin.fail:
        msg: "{{ check_report.split('\n')[-2] }}"
      when: fail_on_crit | bool and check_result == 'CRIT'
